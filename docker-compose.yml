services:
  xvault:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xVault
    ports:
      - "58951:58951"
    volumes:
      - xvault_data:/app/data
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=58951
      - SERVER_URL=http://localhost:58951
      - XVAULT_DB_PATH=/app/data/xVault.sqlite
    restart: unless-stopped

volumes:
  xvault_data:
    driver: local
